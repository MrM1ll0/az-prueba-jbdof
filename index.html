@keyframes bn{0%{opacity:0;transform:scale(.5) rotate(-5deg)}9%{opacity:1;transform:scale(1.14) rotate(1.5deg)}15%{transform:scale(1) rotate(0)}86%{opacity:1}100%{opacity:0;transform:translateY(-1.2em)}}
#toast{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);z-index:31;pointer-events:none;background:linear-gradient(#1a3a5a,#0c1c32);

noscript{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;background:#000;color:#fff}

<script>
'use strict';
(function(){
/* ========== Constantes ========== */
const W=480,COLS=10,BW=40,BH=22,CW=46,CH=27,GX=13,GY=76,CEIL=50;

const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
let SC=1;
const rnd=(a,b)=>a+Math.random()*(b-a);

const pick=a=>a[(Math.random()*a.length)|0];
const PAL=[ // gemas caramelo [luz, medio, oscuro]: rubí, naranja, amarillo, lima, turquesa, zafiro, violeta, rosa
 ['#ff8aa2','#ff1f4d','#7c0620'],['#ffb870','#ff7a00','#8e3a00'],['#fff080','#ffd000','#9a7000'],['#c2ff70','#36e014','#106a04'],
 ['#8afff0','#00ddc0','#00706c'],['#8ab4ff','#1f5cff','#0a208c'],['#d49cff','#9438ff','#3e108c'],['#ff9ee2','#ff3cb8','#8c0a64']];

/* ========== Almacenamiento ========== */
const SAVE_KEY='arkanoid-zombi-v1';
let SAVE={hi:0,maxLvl:1,combos:{},mute:false,gfx:'auto'};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s&&typeof s==='object')SAVE=Object.assign(SAVE,s);}catch(e){}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(SAVE));}catch(e){}}

/* ========== Tipografía y calidad gráfica ========== */
const FONT='"Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,"DejaVu Sans",Arial,sans-serif';
const Q={lvl:2,auto:true,layers:true,fog:2,glow:true,par:true,cap:3,pm:1,shim:true,motes:true};
function applyQ(l){
 Q.lvl=l;Q.layers=l>=2;Q.fog=l>=2?2:l>=1?1:0;Q.glow=l>=1;Q.par=l>=1;Q.cap=l>=2?2.5:l>=1?2:1.5;Q.pm=l>=2?1:l>=1?.7:.4;Q.shim=l>=2;Q.motes=l>=2;
 document.body.classList.toggle('q0',l===0);document.body.classList.toggle('q2',l>=2);
}
function label(s,x,y,size,col,align,weight,stroke){
 ctx.font=(weight||'800')+' '+size+'px '+FONT;ctx.textAlign=align||'left';ctx.textBaseline='top';
 if(stroke!==false){ctx.lineWidth=Math.max(2,size*.2);ctx.strokeStyle='rgba(3,8,26,.9)';ctx.lineJoin='round';ctx.strokeText(s,x,y);}
 ctx.fillStyle=col;ctx.fillText(s,x,y);

/* ========== Audio (WebAudio simple) ========== */
let AC=null,master=null;
function audioInit(){
 // iOS/Safari: el contexto se crea/reanuda dentro de un gesto del usuario y se "desbloquea" con un búfer silencioso
 if(AC){if(AC.state!=='running'){try{AC.resume();}catch(e){}}return;}
 try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();master=AC.createGain();master.gain.value=SAVE.mute?0:.5;master.connect(AC.destination);
  const sb=AC.createBuffer(1,1,22050),ss=AC.createBufferSource();ss.buffer=sb;ss.connect(AC.destination);ss.start(0);
  if(AC.resume)AC.resume();}catch(e){AC=null;}
}
function setMute(m){SAVE.mute=m;save();if(master)master.gain.value=m?0:.5;$('#kSnd').setAttribute('aria-pressed',String(!m));}
function tone(f,d,type,vol,slide,delay){
 if(!AC||SAVE.mute||G.demo)return;const t=AC.currentTime+(delay||0);
 const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
 g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);
}
function noise(d,vol,fc){
 if(!AC||SAVE.mute||G.demo)return;const n=(AC.sampleRate*d)|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
 for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
 const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fc||2500;
 const g=AC.createGain();g.gain.value=vol||.3;s.connect(f);f.connect(g);g.connect(master);s.start();
}

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,6.2832);}
function hex(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function rgba(h,a){const c=hex(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function shade(h,f){const c=hex(h),t=f<0?0:255,p=Math.abs(f);return 'rgb('+c.map(v=>Math.round((t-v)*p+v)).join(',')+')';}
function lg(c,x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);for(const s of stops)g.addColorStop(s[0],s[1]);return g;}
function rg(c,x0,y0,r0,x1,y1,r1,stops){const g=c.createRadialGradient(x0,y0,r0,x1,y1,r1);for(const s of stops)g.addColorStop(s[0],s[1]);return g;}
const SPR={};
function sprite(key,fn,w,h){
 let s=SPR[key];if(s)return s;
 s=document.createElement('canvas');s.width=Math.ceil(w*SC);s.height=Math.ceil(h*SC);
 const c=s.getContext('2d');c.scale(SC,SC);fn(c);return (SPR[key]=s);
}

 const ix=x+lx*rad*.36,iy=y+ly*rad*.36;

function boneSeed(n){let s=n*7919+17;return ()=>(s=(s*16807)%2147483647)/2147483647;}
function jag(c,x,dir,rd,up){ // borde roto con astillas largas: baja (up=false) o sube (up=true) por el extremo
 const n=7,pts=[];
 for(let k=0;k<n;k++){const y=2+k*(16/(n-1));const spike=(k%2?1:-1)*(1.6+rd()*3.2)+(k===2||k===5?-dir*2.5*(rd()+.4):0);pts.push([x-dir*spike*.9,y]);}
 if(up)pts.reverse();

}

function bonePath(c,ids,W,rd){

 c.beginPath();

 // caña con cintura marcada: ancha en los extremos, delgada al centro
 c.moveTo(xs0,2.4);

 if(!hasR){c.lineTo(xs1,2.4);jag(c,xs1+1,-1,rd,false);} else c.lineTo(xs1,17.6);
 c.quadraticCurveTo(mid,13.8,xs0,17.6);
 if(!hasL){jag(c,xs0-1,1,rd,true);}
 c.closePath();
 // epífisis: dos cóndilos redondeados por extremo
 const knob=x=>{c.moveTo(x+6.9,6.8);c.arc(x,6.8,6.9,0,6.2832);c.moveTo(x+6.9,13.2);c.arc(x,13.2,6.9,0,6.2832);c.moveTo(x+5,10);c.rect(x-1,6.8,7,6.4);};
 if(hasL)knob(8);
 if(hasR)knob(W-8);
}

 for(let i=0;i<n&&G.shards.length<Q.cap*90;i++){const a=rnd(0,6.28),s=rnd(1,5.2);
  G.shards.push({k:'tri',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2.2,rot:rnd(0,6),vr:rnd(-.3,.3),vr0:(Math.random()*4)|0,sz:rnd(3,sz||7),col:Array.isArray(col)?pick(col):col,life:rnd(40,85),max:85});}
}
function sparks(x,y,col,n,spd){
 n=Math.max(1,Math.round(n*Q.pm));
 for(let i=0;i<n&&G.shards.length<Q.cap*90;i++){const a=rnd(0,6.28),s=rnd(.6,spd||3.4);
  G.shards.push({k:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.6,rot:rnd(0,3),vr:rnd(-.1,.1),sz:rnd(3,6),col:col||'#ffe066',life:rnd(18,38),max:38,g:.08});}

function puff(x,y,col,n){for(let i=0;i<n&&Q.lvl>=1;i++)G.shards.push({k:'puff',x:x+rnd(-4,4),y,vx:rnd(-.4,.4),vy:rnd(-1,-.3),rot:0,vr:0,sz:rnd(3,5),col:col||'#e6f4ff',life:34,max:34,g:-.01});}
function spawnCoin(x,y,vx,vy){if(G.coins.length<60)G.coins.push({x,y,vx:vx===undefined?rnd(-2.2,2.2):vx,vy:vy===undefined?rnd(-5,-2.5):vy,rot:rnd(0,6),age:0});}

function decayWob(){for(const b of G.bricks){if(b.wob>0)b.wob=Math.max(0,b.wob-.07);if(b.shim>0)b.shim--;}}
function shake(n){if(!G.demo)G.shake=Math.max(G.shake,n);}

/* ----- ladrillos ----- */
function hitBrick(k,src){
 if(k.dead)return;
 if(k.kind==='x'){k.flash=5;k.wob=.6;sparks(k.x+BW/2,k.y+BH/2,'#cfd8e6',4,2.4);sfx('tomb');return;}
 if(src==='iron')k.hp=0;else k.hp-=1;
 k.flash=8;k.wob=1;
 if(k.hp<=0){killBrick(k,src);return;}
 // daño parcial
 sfx('hit');G.score+=5;sparks(k.x+BW/2,k.y+BH/2,PAL[k.col][0],3,2.4);
 if(k.kind==='c'){k.kind='n';k.hp=1;G.shards.push({k:'cone',x:k.x+BW/2,y:k.y,vx:rnd(-2,2),vy:-4,rot:0,vr:.25,sz:8,col:'#ff7a1a',life:70,max:70});}
 else if(k.kind==='h'){burst(k.x+BW/2,k.y+4,['#e6edf5','#8a96a4'],5,4);if(k.hp===1){k.kind='n';}}
}
function dropFor(k){
 const pr=0.13+Math.min(.04,G.lvl*.004);
 if(Math.random()<pr){
  const miss=P.lost.length;
  const w={big:18,bone:16,brain:G.balls.length>=5?0:16,iron:12,sticky:14,repair:miss?22+miss*8:3,gold:1.6};
  let tot=0;for(const q in w)tot+=w[q];let r=Math.random()*tot,kind='big';
  for(const q in w){r-=w[q];if(r<=0){kind=q;break;}}
  G.items.push({kind,x:k.x+BW/2,y:k.y+BH/2,vy:2.1});
 }else if(Math.random()<.03+G.lvl*.012){
  G.items.push({kind:'acid',x:k.x+BW/2,y:k.y+BH/2,vy:2.4+G.lvl*.05});
 }
}
function killBrick(k,src){
 if(k.dead)return;k.dead=true;
 const P_=PAL[k.col],cx=k.x+BW/2,cy=k.y+BH/2;
 const mult=1+Math.min(G.flight,10)*.1;
 G.score+=Math.round((KINDPTS[k.kind]||10)*mult);
 const pts=Math.round((KINDPTS[k.kind]||10)*mult);
 burst(cx,cy,[P_[0],P_[1],P_[1],'#ffffff',P_[2],P_[0]],k.kind==='d'?24:20,8);burst(cx,cy,[P_[0],'#ffffff'],6,4);sparks(cx,cy,P_[0],7,4.6);sparks(cx,cy,'#ffffff',4,3);
 G.shards.push({k:'flash',x:cx,y:cy,vx:0,vy:0,rot:0,vr:0,sz:20,col:P_[1],life:12,max:12,g:0});
 G.rings.push({x:cx,y:cy,r:3,max:34,col:P_[0],life:.9});G.rings.push({x:cx,y:cy,r:2,max:22,col:'#ffffff',life:.7,soft:true});
 addText('+'+pts,cx,cy-8,P_[0],pts>=40||mult>1.5,P_[1]);
 // el zombi se escapa saltando
 G.shards.push({k:'zhead',x:cx,y:cy,vx:rnd(-1.5,1.5),vy:-3.5,rot:0,vr:rnd(-.2,.2),sz:5,col:'',life:50,max:50});
 const nc=k.kind==='d'?4:Math.random()<.55?(Math.random()<.5?2:3):1;
 for(let i=0;i<nc;i++)spawnCoin(cx,cy);
 if(k.kind==='d')sfx('quack');else sfx('break');
 if(!G.boom||src!=='boom')dropFor(k);
 if(src==='ball'||src==='iron'||src==='bone'||src==='boom'){
  G.flight++;
  if(G.flight===4)award('canibal');else if(G.flight===8)award('festin');else if(G.flight===14)award('apoc');
 }
 if(k.kind==='d'){G.ducks++;if(G.ducks===2)award('patitos');}
 if(src==='iron'){G.ironN++;if(G.ironN===6)award('cabezazo');}
 if(src==='bone'){G.boneN++;if(G.boneN===4)award('huesos');}
 if(G.boom)G.boom.n++;
 if(k.kind==='b'){
  const first=!G.boom;if(first)G.boom={n:1};
  sfx('boom');shake(14);ring(cx,cy,64,'#ffb02e');ring(cx,cy,40,'#ffffff');puff(cx,cy,'#5a5060',6);sparks(cx,cy,'#ffb02e',14,6);burst(cx,cy,['#ffb02e','#ff4a1a','#ffe066'],18,8);
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const q=G.grid[k.r+dr]&&G.grid[k.r+dr][k.c+dc];if(q&&!q.dead&&q.kind!=='x'){q.hp=0;killBrick(q,'boom');}}
  if(first){const n=G.boom.n;G.boom=null;if(n>=4)award('cadena');}
 }
}

/* ----- paleta: partes ----- */
function left0(id,s){return id[1]==='L'?s.x1:s.x0;}
function detachPart(){
 const have=['hL','hR','aL','aR'].filter(i=>P.parts[i]);if(!have.length)return false;
 // preferimos manos si hay brazos y manos
 const id=pick(Math.random()<.5?have.filter(i=>i[0]==='h').concat(have):have);
 const L=paddleLayout(),s=L.segs.find(q=>q.id===id);
 P.parts[id]=false;P.lost.push(id);sparks(left0(id,s),PADY+8,'#fff1c4',10,4.5);burst(left0(id,s),PADY+8,['#fff6da','#e6d3a2','#c4aa78'],9,4);puff(left0(id,s),PADY+4,'#f4ead0',5);
 const left=id[1]==='L';
 G.shards.push({k:'part',id,w:s.w,left,x:left?s.x1:s.x0,y:PADY,vx:(left?-1:1)*rnd(1.5,3.5),vy:rnd(-7,-4),rot:0,vr:(left?-1:1)*rnd(.1,.25),sz:0,col:'',life:90,max:90});
 return true;
}
function damagePaddle(){
 G.lvlHurt=true;sfx('bad');shake(10);flashScreen('#ff2a2a');P.bump=8;
 if(!detachPart())loseLife(true);
}
function loseLife(fromHazard){
 G.lvlHurt=true;
 if(!G.demo){G.lives--;if(!fromHazard)detachPart();sfx('lose');shake(16);flashScreen('#ff2a2a');}
 E.big=E.bone=E.iron=E.sticky=0;G.items=[];G.bullets=[];
 if(G.lives<=0&&!G.demo){gameOver();return;}
 respawn();
}
function gameOver(){
 G.mode='over';P.dead=true;G.balls=[];
 while(detachPart());
 burst(P.cx,PADY+10,['#7a5ea8','#b4ee3a','#4a3378'],30,8);
 SAVE.hi=Math.max(SAVE.hi,G.score);save();G.delay=90;G.pending='over';
}
function applyItem(it){
 const k=it.kind,nm=ITEMS[k].n;G.score+=100;
 if(k==='acid'){G.dodged=0;damagePaddle();return;}
 sfx('power');addText(nm.toUpperCase(),it.x,PADY-34,ITEMS[k].col[0],true,ITEMS[k].col[1]);sparks(it.x,PADY,ITEMS[k].col[0],10,4);ring(it.x,PADY,40,ITEMS[k].col[1]);
 if(k==='big')E.big=600;
 else if(k==='bone'){E.bone=540;G.boneN=0;}
 else if(k==='iron')E.iron=420;
 else if(k==='sticky')E.sticky=840;
 else if(k==='repair'){if(P.lost.length){const n=P.lost.length,id=P.lost.pop();P.parts[id]=true;if(n>=3)award('remendado');}else G.score+=200;}
 else if(k==='gold'){G.lives=Math.min(9,G.lives+1);award('suerte');}
 else if(k==='brain'){
  const src=G.balls.slice();
  for(const b of src){for(const da of [-.45,.45]){if(G.balls.length>=7)break;
   const a=Math.atan2(b.vx,-b.vy||-1)+da,sp=b.sp;
   const nb=newBall(false,b.x,b.y,Math.sin(a)*sp,-Math.abs(Math.cos(a))*sp);nb.sp=sp;
   if(b.held){nb.held=false;nb.vx=Math.sin(da)*sp;nb.vy=-Math.cos(da)*sp;}
   G.balls.push(nb);}}
  if(G.balls.length>=5)award('rodantes');
 }
}

/* ----- bola ----- */
function launch(){
 let any=false;
 for(const b of G.balls)if(b.held){b.held=false;const a=rnd(-.22,.22)+(b.off/90);b.vx=Math.sin(a)*b.sp;b.vy=-Math.cos(a)*b.sp;any=true;}
 if(any){sfx('launch');G.idle=0;}
}
function stepBall(b){
 const steps=Math.ceil(b.sp*1.1/3.5),sp=Math.hypot(b.vx,b.vy);
 for(let s=0;s<steps;s++){
  b.x+=b.vx/steps;b.y+=b.vy/steps;
  if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx);b.sq=.8;sfx('wall');}
  else if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx);b.sq=.8;sfx('wall');}
  if(b.y<CEIL+b.r){b.y=CEIL+b.r;b.vy=Math.abs(b.vy);b.sq=.8;sfx('wall');}
  // paleta
  if(b.vy>0){
   const L=paddleLayout();
   if(b.y+b.r>=PADY&&b.y-b.r<PADY+14&&b.x>=L.left-4&&b.x<=L.right+4&&b.y<PADY+8){
    b.y=PADY-b.r;
    const hit=clamp((b.x-P.cx)/(L.w/2),-1,1),a=hit*1.08;
    G.hits++;b.sp=Math.min(b.sp*1.006,LEVELS[G.lvl-1].speed*1.3);
    if(E.sticky>0){b.held=true;b.off=b.x-P.cx;b.vx=b.vy=0;b.trail=[];sfx('paddle');}
    else{b.vx=Math.sin(a)*b.sp;b.vy=-Math.cos(a)*b.sp;sfx('paddle');}
    P.bump=7;b.sq=1;sparks(b.x,PADY,'#ffe9a8',4,2.6);
    G.flight=0;G.ducks=0;G.ironN=0;
    if(Math.abs(hit)>.86){G.tipStreak++;if(G.tipStreak===3)award('puntitas');}else G.tipStreak=0;
    return;
   }
  }
  // ladrillos
  for(const k of G.bricks){
   if(k.dead)continue;
   if(b.x+b.r<k.x||b.x-b.r>k.x+BW||b.y+b.r<k.y||b.y-b.r>k.y+BH)continue;
   const cx=clamp(b.x,k.x,k.x+BW),cy=clamp(b.y,k.y,k.y+BH),dx=b.x-cx,dy=b.y-cy,d2=dx*dx+dy*dy;
   if(d2>=b.r*b.r)continue;
   if(E.iron>0&&k.kind!=='x'){hitBrick(k,'iron');continue;}
   let nx,ny,pen;
   if(d2<1e-6){const ox=Math.min(b.x-k.x,k.x+BW-b.x),oy=Math.min(b.y-k.y,k.y+BH-b.y);
    if(ox<oy){nx=b.x<k.x+BW/2?-1:1;ny=0;pen=ox+b.r;}else{nx=0;ny=b.y<k.y+BH/2?-1:1;pen=oy+b.r;}}
   else{const d=Math.sqrt(d2);nx=dx/d;ny=dy/d;pen=b.r-d;}
   b.x+=nx*pen;b.y+=ny*pen;
   if(Math.abs(nx)>Math.abs(ny))b.vx=Math.abs(b.vx)*Math.sign(nx);else b.vy=Math.abs(b.vy)*Math.sign(ny);
   b.sq=1;hitBrick(k,'ball');
   break;
  }
 }
 // evitar trayectorias casi horizontales
 const m=Math.hypot(b.vx,b.vy)||1;
 if(Math.abs(b.vy)<b.sp*.22){b.vy=(b.vy<0?-1:1)*b.sp*.22;}
 const n=Math.hypot(b.vx,b.vy);b.vx*=b.sp/n;b.vy*=b.sp/n;
}

/* ----- actualización ----- */
function updateWorld(){
 G.t++;
 const L=LEVELS[G.lvl-1];
 // bot
 if(G.bot){
  const b=G.balls.find(q=>!q.held)||G.balls[0];
  if(b){const off=Math.sin(G.t/37)*34;P.tx=b.x+(b.held?0:off);if(b.held&&(G.demo?G.t%90===60:G.t%50===25))launch();}
 }
 // teclado
 const k=G.keys,sp=9;
 if(k.ArrowLeft||k.a)P.tx-=sp;if(k.ArrowRight||k.d)P.tx+=sp;
 const Lo=paddleLayout();P.tx=clamp(P.tx,Lo.w/2,W-Lo.w/2);
 P.cx+=(P.tx-P.cx)*.5;P.cx=clamp(P.cx,Lo.w/2,W-Lo.w/2);
 if(P.bump>0)P.bump--;
 if(E.big>0&&--E.big===0)sfx('hit');
 if(E.bone>0)E.bone--;if(E.iron>0)E.iron--;if(E.sticky>0)E.sticky--;
 if(G.intro>0)G.intro--;
 if(L.sway)for(const b of G.bricks)b.x=b.bx+L.sway*Math.sin(G.t*.02+b.r*.8);
 for(const b of G.bricks)if(b.flash>0)b.flash--;
 decayWob();
 if(Q.shim&&G.t%22===0){const q=G.bricks[(Math.random()*G.bricks.length)|0];if(q&&!q.dead&&q.kind!=='x'&&!(q.shim>0))q.shim=40;}
 for(const b of G.balls)if(b.sq>0)b.sq=Math.max(0,b.sq-.09);
 // bolas
 for(let i=G.balls.length-1;i>=0;i--){
  const b=G.balls[i];
  if(b.held){const t=Lo.segs.find(s=>s.id==='t');b.x=P.cx+b.off;if(!b.off)b.x=t.x0+t.w/2;b.y=PADY-b.r+2;b.vx=b.vy=0;continue;}
  b.trail.push({x:b.x,y:b.y});if(b.trail.length>9)b.trail.shift();
  b.rot+=b.vx*.05;
  stepBall(b);
  if(b.y-b.r>H){G.balls.splice(i,1);}
 }
 if(!G.balls.length&&G.mode!=='over'&&!G.cleared)loseLife(false);
 // huesos
 if(E.bone>0&&--G.fireT<=0&&G.balls.some(q=>!q.held)){
  G.fireT=16;const l=paddleLayout();sfx('shoot');
  G.bullets.push({x:l.left+8,y:PADY-6},{x:l.right-8,y:PADY-6});
 }
 for(let i=G.bullets.length-1;i>=0;i--){
  const q=G.bullets[i];if(!q)continue;q.y-=10;let gone=q.y<CEIL;
  if(!gone)for(const k of G.bricks){if(k.dead||q.x<k.x||q.x>k.x+BW||q.y<k.y||q.y>k.y+BH)continue;hitBrick(k,'bone');gone=true;break;}
  if(gone)G.bullets.splice(i,1);
 }
 // objetos que caen
 const L2=paddleLayout();
 for(let i=G.items.length-1;i>=0;i--){
  const it=G.items[i];if(!it)continue;it.y+=it.vy;
  if(it.y+12>=PADY&&it.y-12<PADY+16&&it.x>=L2.left-10&&it.x<=L2.right+10){G.items.splice(i,1);applyItem(it);continue;}
  if(it.y>H+20){G.items.splice(i,1);if(it.kind==='acid'){G.dodged++;if(G.dodged===6)award('baba');}}
 }
 for(let i=G.coins.length-1;i>=0;i--){
  const c=G.coins[i];if(!c)continue;c.age++;c.vy+=.2;c.x+=c.vx;c.y+=c.vy;c.rot+=.25;
  if(c.x<6||c.x>W-6)c.vx=-c.vx;
  const dxp=P.cx-c.x;if(c.age>20&&c.y>PADY-90&&Math.abs(dxp)<90){c.x+=Math.sign(dxp)*1.2;}
  if(c.age>10&&c.y+5>=PADY&&c.y-5<PADY+16&&c.x>=L2.left-6&&c.x<=L2.right+6){
   G.coins.splice(i,1);G.score+=50;sfx('coin');G.coinsLvl++;sparks(c.x,c.y,'#fff3a0',3,2.4);
   if(G.coinsLvl===12)award('bolsillos');continue;}
  if(c.y>H+20)G.coins.splice(i,1);
 }
 if(G.rain>0){G.rain--;if(G.rain%3===0)spawnCoin(rnd(20,W-20),CEIL+6,rnd(-.5,.5),1);}
 // fx
 updateFx();
 // fin de nivel
 if(!G.cleared&&!breakable()){levelClear();}
 // demo: reinicio
 if(G.demo&&(G.cleared||G.t>60*70)){loadLevel(1+((Math.random()*10)|0));G.bot=true;G.demo=true;G.intro=0;}
}
function updateFx(){
 if(G.shake>0)G.shake=Math.max(0,G.shake-1);
 for(let i=G.shards.length-1;i>=0;i--){const s=G.shards[i];s.vy+=s.g===undefined?.22:s.g;s.x+=s.vx;s.y+=s.vy;s.rot+=s.vr;if(s.k==='puff'){s.vx*=.97;}if(--s.life<=0||s.y>H+30)G.shards.splice(i,1);}
 for(let i=G.rings.length-1;i>=0;i--){const r=G.rings[i];r.r+=(r.max-r.r)*.2+.8;r.life-=r.soft?.06:.05;if(r.life<=0)G.rings.splice(i,1);}
 for(let i=G.texts.length-1;i>=0;i--){const t=G.texts[i];t.y-=.6;if(--t.life<=0)G.texts.splice(i,1);}
}
function levelClear(){
 G.cleared=true;if(G.demo)return;
 const bonus=500+G.lives*200;G.score+=bonus;sfx('win');
 const only=!P.parts.hL&&!P.parts.hR&&!P.parts.aL&&!P.parts.aR;
 if(only)award('torso');
 if(!G.lvlHurt)award('impecable');
 SAVE.maxLvl=Math.max(SAVE.maxLvl,Math.min(10,G.lvl+1));SAVE.hi=Math.max(SAVE.hi,G.score);save();
 G.balls=[];G.items=[];G.bullets=[];
 G.mode='clear';G.delay=70;G.pending=G.lvl>=10?'win':'clear';G.clearBonus=bonus;
}
/* ========== Render ========== */
const BGPAL=[['#12247a','#4e1c92','#d8f0ff'],['#2e1078','#82207e','#ffd0f0'],['#0b4466','#2c1c86','#c8ffe0'],['#521058','#2c1c86','#ffd8c8'],['#1c1c86','#10667a','#c8d8ff'],
 ['#64300f','#70205f','#ffe4ac'],['#10586a','#40208f','#c8fff4'],['#40107a','#86303c','#f0d4ff'],['#505010','#10663f','#f8ffb4'],['#640c1c','#2e0c64','#ffc4b4']];
const BGPAD=34,BGAMP=[3,8,15,26];
function seeded(n){let s=n*977+13;return ()=>(s=(s*16807)%2147483647)/2147483647;}
function paintBgLayer(c,li,n){
 const p=BGPAL[(n-1)%10],rd=seeded(n*7+li),gy=H-150;
 if(li===0){
  const FW=W+2*BGPAD;

 const keep={lives:G.lives,score:G.score};
 loadLevel(n);G.lives=keep.lives;G.score=keep.score;G.mode='play';
 if(P.lost.length){const id=P.lost.pop();P.parts[id]=true;}
}
/* toasts / compartir */
let toastT=0;
function toast(s,ms){const t=$('#toast');t.textContent=s;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms||2600);}
function copyText(s){
 const fb=()=>{const ta=document.createElement('textarea');ta.value=s;ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();return ok;};
 if(navigator.clipboard&&navigator.clipboard.writeText&&window.isSecureContext)return navigator.clipboard.writeText(s).then(()=>true,()=>fb());
 return Promise.resolve(fb());
}
async function shareGame(){
 const url=location.href.split('#')[0],extra=(G.mode==='over'&&G.score)?' Hice '+G.score+' puntos.':'';
 const data={title:'Arkanoid Zombi',text:'¡Rompe gemas con zombis dentro en Arkanoid Zombi!'+extra,url};
 if(navigator.share){try{await navigator.share(data);return;}catch(e){if(e&&e.name==='AbortError')return;}}
 const ok=await copyText(url);
 if(ok)toast('¡Enlace copiado!');else{toast('Copia el enlace manualmente');try{prompt('Copia el enlace:',url);}catch(e){}}
}
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const STANDALONE=!!(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches));
function toggleFs(){
 const el=document.documentElement,fs=document.fullscreenElement||document.webkitFullscreenElement;
 if(fs){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
 else if(el.requestFullscreen||el.webkitRequestFullscreen){
  try{const r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);if(r&&r.catch)r.catch(()=>document.body.classList.add('pfs'));}catch(e){document.body.classList.add('pfs');}
 }else{ // iPhone: sin API nativa -> modo simulado + instrucción
  const on=document.body.classList.toggle('pfs');window.scrollTo(0,1);
  if(on&&IOS&&!STANDALONE)toast('Pantalla completa: Compartir → Añadir a pantalla de inicio',4200);
 }
 setTimeout(fit,150);
}
if(STANDALONE)$('#kFs').style.display='none';
// Safari iOS: bloquear zoom por pellizco / doble toque y desbloquear el audio con cualquier gesto
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
document.addEventListener('dblclick',e=>e.preventDefault());
['touchstart','touchend','click'].forEach(ev=>document.addEventListener(ev,()=>audioInit(),{passive:true,capture:true}));
document.addEventListener('touchmove',e=>{if(e.target===cv||e.target.closest&&e.target.closest('#screen')&&!e.target.closest('.panel'))e.preventDefault();},{passive:false});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)audioInit();});
/* ----- ajuste de tamaño ----- */
function fit(){
 const r=$('#wrap').getBoundingClientRect(),scr=$('#screen'),s0=Math.max(.2,r.width/W);
 const Hn=Math.round(clamp(r.height/s0,680,820)),s=Math.max(.2,Math.min(s0,r.height/Hn));
 if(Hn!==H){H=Hn;PADY=H-74;for(const k in SPR)if(k.startsWith('bg'))delete SPR[k];}
 scr.style.width=Math.floor(W*s)+'px';scr.style.height=Math.floor(H*s)+'px';scr.style.fontSize=(16*s)+'px';
 const n=clamp(s*(window.devicePixelRatio||1),1,Q.cap);
 if(Math.abs(n-SC)>.05){SC=n;for(const k in SPR)delete SPR[k];}
 cv.width=Math.round(W*SC);cv.height=Math.round(H*SC);
}
/* ----- entrada ----- */
const ptr={id:null,x:0,y:0,sx:0,sy:0,t:0,moved:0,type:''};
const toLogical=e=>{const r=cv.getBoundingClientRect();return (e.clientX-r.left)/r.width*W;};
cv.addEventListener('pointerdown',e=>{
 audioInit();if(e.pointerType!=='mouse')isTouch=true;
 if(G.mode!=='play')return;
 e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}
 Object.assign(ptr,{id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now(),moved:0,type:e.pointerType});
 if(e.pointerType==='mouse'){P.tx=toLogical(e);launch();}
});
cv.addEventListener('pointermove',e=>{
 if(G.mode!=='play')return;
 if(e.pointerType==='mouse'){P.tx=toLogical(e);return;}
 if(e.pointerId!==ptr.id)return;e.preventDefault();
 const r=cv.getBoundingClientRect(),dx=(e.clientX-ptr.x)/r.width*W*1.25;
 ptr.moved+=Math.abs(e.clientX-ptr.x)+Math.abs(e.clientY-ptr.y);ptr.x=e.clientX;ptr.y=e.clientY;P.tx+=dx;
});
const endPtr=e=>{
 if(e.pointerId!==ptr.id)return;ptr.id=null;
 if(e.pointerType!=='mouse'&&G.mode==='play'&&ptr.moved<14&&performance.now()-ptr.t<450)launch();
};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',e=>{if(e.pointerId===ptr.id)ptr.id=null;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
 audioInit();
 const k=e.key;G.keys[k]=true;if(k.length===1)G.keys[k.toLowerCase()]=true;
 if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(k))e.preventDefault();
 if((k===' '||k==='ArrowUp'||k==='Enter')&&G.mode==='play')launch();
 else if(k==='p'||k==='P'||k==='Escape'){if(G.mode==='play'||G.mode==='paused')pauseGame();}
 else if(k==='m'||k==='M')setMute(!SAVE.mute);
 else if(k==='f'||k==='F')toggleFs();
});
addEventListener('keyup',e=>{G.keys[e.key]=false;if(e.key.length===1)G.keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{G.keys={};if(G.mode==='play')pauseGame();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.mode==='play')pauseGame();});
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>setTimeout(fit,100)));
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
if(window.ResizeObserver)new ResizeObserver(fit).observe($('#wrap'));
/* botones */
$('#bPlay').onclick=()=>play(selLvl);
$('#bLvM').onclick=()=>{selLvl--;updateMenu();};$('#bLvP').onclick=()=>{selLvl++;updateMenu();};
$('#bDex').onclick=()=>{renderDex();showPanel('dex');};$('#bDexBack').onclick=()=>showPanel('menu');
$('#bResume').onclick=pauseGame;$('#bMenu1').onclick=()=>toMenu();$('#bMenu2').onclick=()=>toMenu();
$('#bNext').onclick=nextLevel;$('#bRetry').onclick=()=>play(G.startLvl);$('#bShare2').onclick=shareGame;
$('#kPause').onclick=()=>{if(G.mode==='play'||G.mode==='paused')pauseGame();};
$('#kSnd').onclick=()=>{audioInit();setMute(!SAVE.mute);};
$('#kFs').onclick=toggleFs;$('#kShare').onclick=shareGame;
setMute(SAVE.mute);

/* ========== Bucle ========== */
let last=performance.now(),acc=0;
function tick(){
 if(G.mode==='menu'||G.mode==='play')updateWorld();
 else if(G.mode==='clear'||G.mode==='over'){G.t++;updateFx();if(G.delay>0&&--G.delay===0)showPending();}
}
let pAcc=0,pN=0,pWarm=0,pLow=0;
function perfWatch(dt){
 if(!Q.auto||document.hidden||G.mode==='paused'||dt>200)return;
 if(++pWarm<60)return;pAcc+=dt;pN++;
 if(pN>=45){const avg=pAcc/pN;pAcc=pN=0;if(avg>21.5){if(++pLow>=2&&Q.lvl>0){setQuality(Q.lvl-1,true);pLow=0;pWarm=0;}}else pLow=0;}
}
function setQuality(l,note){applyQ(l);fit();if(note)toast('Gráficos reducidos para mantener la fluidez');updateGfx();}
const GFXN={auto:'Auto','2':'Alto','1':'Medio','0':'Bajo'};
function updateGfx(){$('#bGfx').textContent='Gráficos: '+GFXN[SAVE.gfx]+(SAVE.gfx==='auto'?' ('+['bajo','medio','alto'][Q.lvl]+')':'');}
function initQuality(){
 const q=new URLSearchParams(location.search).get('q')||SAVE.gfx||'auto';
 if(q==='auto'){Q.auto=true;applyQ(2);}else{Q.auto=false;applyQ(clamp(parseInt(q,10)||0,0,2));}
}
$('#bGfx').onclick=()=>{const o=['auto','2','1','0'];SAVE.gfx=o[(o.indexOf(SAVE.gfx)+1)%4];save();if(SAVE.gfx==='auto'){Q.auto=true;pWarm=0;applyQ(2);}else{Q.auto=false;applyQ(+SAVE.gfx);}fit();updateGfx();};
/* mascota animada del menú */
const mc=$('#mascot'),mx=mc.getContext('2d');
function drawMascot(t){
 if(!$('#menu').classList.contains('on'))return;
 mx.setTransform(1,0,0,1,0,0);mx.clearRect(0,0,mc.width,mc.height);
 const s=mc.width/140,bob=Math.sin(t*2.2)*1.6,v=(t%3.6)<.16?3:0;
 mx.setTransform(s,0,0,s,0,0);mx.translate(70,60+bob);
 miniBody(mx,0,10,26,v,1);zhead(mx,0,10,26,v);paintCone(mx,0,10,26);
 mx.save();mx.translate(-52,34);mx.rotate(Math.sin(t*3)*.12);mx.scale(3.4,3.4);paintDuck(mx,0,0);mx.restore();
}
function frame(now){
 requestAnimationFrame(frame);
 let dt=now-last;last=now;perfWatch(dt);if(dt>100)dt=100;acc+=dt;
 let n=0;
 try{while(acc>=TICK&&n<8){acc-=TICK;n++;for(let i=0;i<G.fast;i++)tick();}}catch(err){console.error('AZ-TICK',err&&err.stack||err);}
 try{render();}catch(err){console.error('AZ-RENDER',err&&err.stack||err);}
 if(((now/16)|0)%2===0)drawMascot(now/1000);
}
initQuality();fit();toMenu();updateGfx();
const q=new URLSearchParams(location.search);
if(q.get('nivel')){const n=clamp(parseInt(q.get('nivel'),10)||1,1,10);play(n);if(q.get('bot'))G.bot=true;}
requestAnimationFrame(frame);
// ganchos para pruebas automáticas
window.__az={audio:()=>AC?AC.state:"none",dbg:{paintCone,miniBody,paintDuck,paintZombie,paintBack,paintGlass,paintTomb,zhead,paintOrb,drawBrick,sprite,SPR,boneSprite,headSpr,BP,BW,BH,PAL},Q,setQuality,G,P,E,SAVE,COMBOS,LEVELS,play,toMenu,award,applyItem,killBrick,hitBrick,launch,pauseGame,shareGame,toggleFs,fit,paddleLayout,detachPart,damagePaddle,nextLevel,loadLevel};
})();
</script>
</body>
